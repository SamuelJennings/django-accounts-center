codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

# Family coverage gating.
# 100% is brittle (it fails a PR over a single defensive branch or unreachable
# guard). These are floors with headroom, not a ratchet.
#   project — overall coverage floor for the package.
#   patch   — coverage required of the lines changed in a PR (new code).
# The 1% threshold absorbs rounding and small, justified dips.
coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 85%
        threshold: 1%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no

ignore:
  - "tests/**"
  - "screenshots/**"
  - "example/**"
  - "docs/**"
  - "**/migrations/**"
  - "**/__pycache__/**"
