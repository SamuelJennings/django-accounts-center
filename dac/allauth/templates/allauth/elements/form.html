{% load allauth %}
<form method="{{ attrs.method }}"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}
      class="flex flex-col gap-4 my-4">
  {% slot body %}
  {% endslot %}
  {% if slots.actions %}
    <div class="flex flex-wrap items-center gap-2">
      {% slot actions %}
      {% endslot %}
    </div>
  {% endif %}
</form>
