{% load static i18n %}

{% comment %} Developers can override this component template to change logo. 
Apply responsive height variationg using the style tag on the component. E.g.

<c-entrance.logo style="--height: 50px;--height-md: 70px, --height-lg: 85px;/>    {% endcomment %}
<c-vars alt="{% trans "Site Logo" %}" class />
<img src="{% static 'dac/logo/dac_bg_transparent.svg' %}"
     alt="{{ alt }}"
     class="image-height mx-auto {{ class }}"
     {{ attrs }} />
