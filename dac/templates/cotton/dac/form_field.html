{% comment %} For very simple form fields {% endcomment %}
<c-vars type="input"
        label
        wrapper-class
        label-class
        class />
<div class="mb-3 {{ wrapper_class }}">
  <label class="form-label {{ label_class }}">{{ label }}</label>
  {% if type == "textarea" %}
    <textarea class="form-control {{ class }}" {{ attrs }}>
      {{ slot }}
    </textarea>
  {% else %}
    <input class="form-control {{ class }}" {{ attrs }} />
  {% endif %}
</div>
