{% extends "account/base_reauthenticate.html" %}
{% load i18n %}

{% block reauthenticate_content %}
  <c-form method="post"
          action="{% url 'account_reauthenticate' %}"
          :form-obj="form">
    {{ redirect_field }}
    <c-button.stack>
      <c-button type="submit"
                variant="primary"
                text="{% trans "Confirm" %}" />
    </c-button.stack>
  </c-form>
{% endblock %}
