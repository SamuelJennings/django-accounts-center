{% extends "account/base_entrance.html" %}
{% load i18n %}

{% block title %}
  {% trans "Enter verification code" %}
{% endblock %}

{% block content %}
  <c-allauth.confirm-code recipient="{{ phone }}"
                          action="{% url 'account_verify_phone' %}"
                          resend-url="{% url 'account_confirm_password_reset_code' %}"
                          change-title="{% trans "Use a different phone number" %}" />
{% endblock content %}
