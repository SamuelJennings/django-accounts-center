name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

jobs:
  call-release:
    uses: django-mvp/.github/workflows/release.yml@main
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    with:
      skip-existing-pypi: true
    secrets: inherit
