name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

jobs:
  call-release:
    uses: django-mvp/shared/.github/workflows/release.yml@main
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: write
    with:
      skip-existing-pypi: true
    secrets: inherit
